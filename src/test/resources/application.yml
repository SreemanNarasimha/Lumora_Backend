spring:
  application:
    name: LumiereBackend
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  mail:
    host: localhost
    port: 25
    username: test
    password: test

lumiere:
  security:
    jwt:
      secret: dummy_secret_key_that_is_at_least_256_bits_long_so_jjwt_doesnt_complain
      access-expiration-ms: 900000
      refresh-expiration-ms: 604800000
  razorpay:
    key-id: dummy
    key-secret: dummy
    webhook-secret: dummy
  frontend:
    url: http://localhost:3000

server:
  port: 8080
